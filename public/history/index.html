<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Changelog — Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0c0c;
      --bg-2: #171717;
      --bg-3: #1c1c1c;
      --line: #2e2e2e;
      --ink: #ededed;
      --muted: #7e7e7e;
      --soft: #b4b4b4;
      --green: #3ecf8e;
      --green-dim: rgba(62, 207, 142, 0.12);
      --gone: #f87171;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: 15px;
      line-height: 1.75;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 56px 56px;
      opacity: 0.12;
      mask-image: radial-gradient(ellipse 80% 50% at 50% -10%, #000 30%, transparent 75%);
    }
    a { color: var(--green); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 28px;
      height: 52px;
      border-bottom: 1px solid var(--line);
      background: rgba(12,12,12,.86);
      backdrop-filter: blur(12px);
    }
    .brand {
      font-weight: 600;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(62, 207, 142, 0.55);
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(62, 207, 142, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(62, 207, 142, 0); }
      100% { box-shadow: 0 0 0 0 rgba(62, 207, 142, 0); }
    }
    .brand span { color: var(--muted); font-weight: 400; font-size: 13px; }
    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      max-width: 1040px;
      margin: 0 auto;
      min-height: calc(100vh - 52px);
    }
    nav.side {
      position: sticky;
      top: 52px;
      align-self: start;
      height: calc(100vh - 52px);
      overflow: auto;
      padding: 28px 12px 48px 16px;
      border-right: 1px solid var(--line);
    }
    nav.side h2 {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 14px 8px;
      font-weight: 600;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    nav.side a {
      display: block;
      color: var(--soft);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 2px;
      border-left: 2px solid transparent;
    }
    nav.side a:hover { background: var(--bg-2); text-decoration: none; color: var(--ink); }
    nav.side a.on {
      background: var(--green-dim);
      color: var(--green);
      border-left-color: var(--green);
    }
    nav.side a .id {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      margin-right: 8px;
      color: var(--muted);
    }
    nav.side a.on .id { color: var(--green); }
    main {
      padding: 40px 36px 96px 32px;
      min-width: 0;
    }
    .prose { max-width: 42rem; }
    .hero h1 {
      font-size: 40px;
      letter-spacing: -0.045em;
      margin: 0 0 14px;
      font-weight: 600;
      line-height: 1.15;
    }
    .hero .typed {
      display: inline-block;
      border-right: 2px solid var(--green);
      padding-right: 2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { border-color: transparent; } }
    .hero p#lede {
      color: var(--soft);
      margin: 0 0 18px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      color: var(--muted);
      font-size: 12px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      margin-bottom: 28px;
    }
    .tree-wrap {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--bg-3), var(--bg-2));
      border-radius: 10px;
      padding: 16px 12px 10px;
      margin: 0 0 48px;
      overflow-x: auto;
    }
    .tree-wrap p {
      margin: 0 0 12px 4px;
      color: var(--muted);
      font-size: 13px;
    }
    svg.tree { display: block; width: 100%; max-width: 420px; height: auto; }
    svg.tree .lane {
      stroke-dasharray: 480;
      stroke-dashoffset: 480;
      animation: draw 1.2s cubic-bezier(.2,.7,.2,1) forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    svg.tree circle { cursor: pointer; }
    svg.tree circle:hover { filter: drop-shadow(0 0 6px currentColor); }
    .release {
      margin: 0 0 56px;
      scroll-margin-top: 76px;
    }
    .release.in {
      animation: rise 0.45s ease;
    }
    @keyframes rise {
      from { opacity: 0.55; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .release h2 {
      font-size: 22px;
      letter-spacing: -0.035em;
      margin: 0 0 8px;
      font-weight: 600;
    }
    .ver {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: var(--green);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .purpose { color: var(--soft); margin: 0 0 18px; }
    .story {
      border-left: 2px solid var(--green);
      padding: 2px 0 2px 16px;
      margin: 0 0 22px;
      color: var(--ink);
    }
    .story p { margin: 0 0 12px; }
    .story p:last-child { margin-bottom: 0; }
    .item {
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }
    .item h3 {
      font-size: 15.5px;
      font-weight: 600;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .item h3 .n {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      min-width: 1.6em;
      flex-shrink: 0;
    }
    .flow {
      margin: 0 0 10px;
      color: var(--ink);
      line-height: 1.55;
    }
    .kv {
      margin: 0 0 10px;
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .kv .k {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      padding-top: 2px;
    }
    .kv.now .k { color: var(--green); }
    .kv.gone .k { color: var(--gone); }
    .kv .v { color: var(--ink); }
    .kv.gone .v { color: #fca5a5; text-decoration: line-through; text-decoration-color: rgba(248,113,113,.45); }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      nav.side {
        position: relative;
        top: 0;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 10px 14px;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }
      nav.side h2 { display: none; }
      nav.side a { display: inline-block; border-left: 0; }
      main { padding: 24px 16px 72px; }
      .hero h1 { font-size: 28px; }
      .kv { grid-template-columns: 1fr; gap: 2px; }
      .prose { max-width: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot"></span> Drop <span>Changelog</span></div>
    <a href="https://dgistdrop.com">dgistdrop.com</a>
  </header>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <main>
      <section class="hero prose">
        <h1><span class="typed">Version history</span></h1>
        <p id="lede"></p>
        <div class="meta" id="meta"></div>
      </section>
      <section class="tree-wrap">
        <p>위가 이른 버전, 아래가 최근임. 사이드바·본문과 동일함. 가로는 주제. 점을 누르면 해당 구간으로 이동함.</p>
        <div id="tree"></div>
      </section>
      <div id="releases" class="prose"></div>
    </main>
  </div>
  <script>
    const DATA = {"product":"Drop","subtitle":"소프트웨어 변경 이력서","org":"DGIST 배드민턴 동아리 Drop","docNo":"DROP-CHG-001","classification":"내부용","audience":"동아리 운영진","repo":"https://github.com/Jajungi/DGISTDrop","updated":"2026-08-30","intro":"본 문서는 Drop 웹·앱의 Git 이력을 근거로 배포 단위별 변경 사항을 정리한 내부 이력서임. 동일 목적의 연속 커밋은 하나의 항목으로 통합함. 기능·정책 변경 시 본 문서를 개정함.","releases":[{"id":"0.1","date":"2026-07-07","title":"첫 앱과 웹 배포","purpose":"동아리 코트·출석·포인트를 한 앱에서 처리하고, 브라우저로도 이용할 수 있게 함.","changes":[{"what":"Expo 앱 초기 구성 (코트 9면, 로그인, 프로필, 관리)","why":"현장 예약·출석·포인트를 카톡/엑셀 대신 한곳에서 처리하기 위해","was":"코트 배정과 출석·포인트를 카톡 공지와 엑셀에 따로 기록함. 현장에서 면별 사용 현황을 한 화면에서 확인할 수 없었음.","now":"Expo 앱에 코트 9면, 학번 로그인, 프로필, 관리 화면을 한 코드베이스로 구성함. 웹과 앱이 동일 화면을 사용하도록 함.","gone":null},{"what":"게스트(이름만) 입장","why":"아직 학번 가입을 안 한 사람도 당일 코트만 쓸 수 있게","was":"학번 계정이 없으면 앱에 입장할 수 없었음. 당일 방문자는 이용할 수 없었음.","now":"이름만 입력하는 게스트 입장을 추가함. 당시 게스트 계정은 수일간 잔존할 수 있었고, 당일 자동 삭제는 없었음.","gone":null},{"what":"Cloudflare Pages 웹 배포와 가이드","why":"앱스토어 없이 링크로 바로 쓰게 하려고","was":"스토어 앱이 있어야 이용할 수 있다는 전제였음. 링크로 바로 여는 주소가 없었음.","now":"Cloudflare Pages로 브라우저 주소만으로 열리게 하고, 배포 순서를 가이드에 기재함.","gone":null},{"what":"웹 아이콘 폰트가 Cloudflare에서 빠지며 흰 화면이 되던 문제 수정","why":"배포 직후 사이트가 열리지 않던 장애를 막기 위해","was":"배포 직후 아이콘 폰트(Ionicons 등)가 Cloudflare에서 누락되어 흰 화면만 표시됨. node_modules 하위 에셋을 페이지가 건너뛰던 설정 문제였음.","now":"에셋이 배포물에 포함되도록 경로·빌드를 수정함. 배포 직후 빈 화면이 재발하지 않도록 함.","gone":null},{"what":"관리자 DB 초기화 패널과 확인 코드","why":"테스트 데이터를 실수로 지우지 않게 하려고","was":"관리자가 확인 문구 없이 테스트 데이터를 일괄 삭제할 수 있었음.","now":"DB 초기화 패널에 숫자 확인 코드를 넣음. 숫자를 맞춰야 실행됨.","gone":null}],"story":"Drop의 첫 배포 구간임. 당시 홈 화면 명칭은 ‘코트 예약’이었고, 9면 예약·출석·포인트를 한 앱에서 처리하는 것이 목표였음.\n\n웹은 Cloudflare Pages, 앱은 Expo 템플릿으로 시작함. 게스트는 이름만 입력하면 입장 가능했으나, 서울 날짜 변경 시 게스트 삭제 규칙은 없었음. 카카오 챗봇·명단 가입 제한·현황 전용 모드도 당시에는 없음."},{"id":"0.2","date":"2026-07-08","title":"코치·푸시·스토어 준비","purpose":"레슨 운영과 원격 알림을 넣고, Android 스토어 빌드가 가능하게 함.","changes":[{"what":"코치 권한, 프로필 시트, 푸시 토큰 테이블·마이그레이션","why":"레슨 대기와 공지를 앱에서 돌리기 위해","was":"코치·레슨이 앱 권한으로 구분되지 않음. 레슨 대기와 공지를 일반 회원 흐름과 나눌 필드가 없었음.","now":"is_coach 플래그, 프로필 시트, push_tokens 마이그레이션을 추가함. 레슨과 푸시의 기반을 마련함.","gone":null},{"what":"Expo SDK 57 패치, EAS·FCM(google-services) 연결","why":"Android 푸시와 스토어 빌드에 필요해서","was":"Expo SDK와 FCM이 스토어 빌드에 맞춰져 있지 않음. Android 푸시용 google-services도 없었음.","now":"SDK 57, EAS, google-services.json을 연결함. 스토어 패키징과 기기 푸시의 전제를 맞춤.","gone":null},{"what":"모바일 레이아웃·탭바·시간 선택 개선","why":"체육관 폰에서 버튼이 작거나 잘리던 문제를 줄이려고","was":"체육관 폰에서 하단 탭·시간 버튼이 작거나 잘림. 조작이 어려웠음.","now":"모바일 레이아웃과 탭바, 시간 선택을 확대하고 간격을 조정함.","gone":null},{"what":"개인정보처리방침·스토어 문구·아키텍처 문서","why":"배포와 심사에 필요한 공개 설명을 맞추려고","was":"심사·배포용 공개 문구가 저장소에 없었음.","now":"개인정보처리방침, 스토어 문구, 아키텍처 문서를 추가함.","gone":null}],"story":"코치 코트와 원격 알림, Android 스토어 빌드를 이 구간에 도입함.\n\npush_tokens 테이블을 신설했으나, 당시에는 발송 실패 토큰을 자동 삭제하지 않음. 동일인의 복수 기기 유지 방침은 이후 1.2에서 정함."},{"id":"0.3","date":"2026-07-09","title":"브랜드와 서버 동기화","purpose":"겉모습을 Drop 로고에 맞추고, 웹에서 누른 관리 동작이 DB에 실제로 남게 함.","changes":[{"what":"아이콘·스플래시를 Drop 로고로 교체","why":"Expo 기본 아이콘이 동아리 앱처럼 안 보여서","was":"앱 아이콘과 스플래시가 Expo 기본 그림이었음. 동아리 앱으로 보이지 않음.","now":"아이콘과 스플래시를 Drop 로고로 교체함.","gone":"Expo 기본 아이콘·스플래시 에셋"},{"what":"문서 톤을 공식 안내체로 정리, 저장소 이름을 DGISTDrop으로 맞춤","why":"대외 자료와 코드 설명이 같은 이름을 쓰게","was":"문서 제목과 GitHub 저장소 이름이 제각각이었음. 대외 자료와 코드 설명이 다른 명칭을 사용함.","now":"안내 문장 톤을 공식 안내체로 맞추고, 저장소 이름을 DGISTDrop으로 통일함.","gone":null},{"what":"웹 계정 삭제에 숫자 확인 모달","why":"브라우저 Alert 버튼이 안 먹는 경우를 피하려고","was":"웹 계정 삭제가 브라우저 Alert에 의존함. 일부 환경에서 확인 버튼이 동작하지 않음.","now":"앱과 동일한 숫자 확인 모달로 변경함.","gone":"window.alert 기반 삭제 확인"},{"what":"관리자 취소·프로필 변경·로그인·경기 결과를 Supabase에 맞춤","why":"화면만 바뀌고 DB는 그대로인 구멍을 막기 위해","was":"관리자 예약 취소, 프로필 변경, 로그인 상태, 경기 결과가 화면에만 반영되고 DB는 그대로인 구멍이 있었음.","now":"해당 동작을 Supabase RPC·테이블 기록에 맞춤. 새로고침 후에도 동일 상태가 유지됨.","gone":null},{"what":"RLS·RPC 권한 강화","why":"클라이언트가 포인트·권한을 직접 올리지 못하게","was":"클라이언트가 포인트나 권한 컬럼을 직접 올릴 여지가 있었음.","now":"RLS와 RPC 실행 권한을 강화함. 권한·포인트 변경은 서버 함수를 거치도록 함.","gone":null}],"story":"겉모습을 Drop 로고로 교체하고, 웹에서 수행한 관리 동작이 브라우저 메모리에만 남지 않고 Supabase에 기록되도록 맞춘 구간임 대기열을 앱 안에 넣음.","gone":null}],"story":"운영자 역할을 나누고, 코트 확대·활동 시간·화면 공지를 현장에 맞춘 구간임.\n\n정기 활동 요일은 당시 화·목에 가깝게 코드에 들어 있었고, 이후 1.1에서 월·수 18:30–21:40으로 변경됨. 무대가 위, 입구가 아래인 9면 배치를 이 구간에서 고정함."},{"id":"0.6","date":"2026-08-01","title":"모집·친구·도착","purpose":"파트너를 구하는 흐름과 친구 일정을 현장 시간에 맞게 맞춤.","changes":[{"what":"로비 합류 승인, 친구 파트너 추천, 도착 알림, 일정 겹침 표시","why":"아무나 방에 들어가지 않게 하고, 같이 칠 사람을 찾기 쉽게","was":"모집방에 신청 없이 바로 들어가거나, 친구의 당일 일정을 앱에서 보기 어려웠음. 체육관 도착 여부를 푸시로 알 수 없었음.","now":"로비 합류는 호스트 승인을 거침. 파트너 추천, 도착 알림, 일정 겹침 표시를 추가함.","gone":"무승인 즉시 입실 흐름"}],"story":"파트너 모집과 친구 일정을 이 구간에 붙임. 로비 방은 즉시 입실하지 않고 호스트 승인을 거침.\n\n도착 알림과 일정 겹침 표시가 여기서 시작됨. 이후 현황 모드에서도 로비는 유지되며, 예약이 꺼져 있으면 일부 모집 문구는 숨김."},{"id":"0.7","date":"2026-08-11","title":"무료 DB 유지","purpose":"한동안 접속이 없어도 Supabase 무료 프로젝트가 멈추지 않게 함.","changes":[{"what":"GitHub Actions로 Supabase keepalive ping","why":"무료 플랜이 7일 미사용 시 일시정지되기 때문에","was":"일정 기간 접속이 없으면 DB가 일시정지될 수 있었음. 다음 활동일 로그인이 실패할 여지가 있었음.","now":"GitHub Actions가 주기적으로 keepalive ping을 보냄. 프로젝트가 잠들지 않도록 함.","gone":null}],"story":"Supabase 무료 프로젝트가 7일 미사용 시 정지되는 제약을 우회하기 위한 운영 구간임. 회원 화면은 거의 바뀌지 않음. keepalive ping만 GitHub Actions에 넣음."},{"id":"0.8","date":"2026-08-19 ~ 08-20","title":"카카오 챗봇에서 앱 푸시로","purpose":"카카오 채널 연동을 시도했다가, 개인 알림은 앱·웹 푸시가 더 맞다고 보고 방향을 바꿈.","changes":[{"what":"카카오 비즈니스 채널 챗봇 서버, 바로연결, 관리 패널, 단톡 안내","why":"처음에는 카톡으로 현황·참석을 받으려 해서","was":"단톡에서 공감/버튼으로 참석을 받고, Render 챗봇 서버와 오픈빌더 스킬로 카톡 응답을 붙이려 함. 관리 화면에 봇 연동 패널이 있었음.","now":"챗봇 실험을 종료함. 활동 알림은 앱·웹 푸시로만 발송함.","gone":"카카오 챗봇 서버, 오픈빌더 스킬 연동, 단톡 봇 관리 패널"},{"what":"카카오 아이디 연동을 프로필에 넣었다가 컬럼·주석까지 제거","why":"채널 정책·유지비가 동아리 규모에 안 맞아 푸시로 대체하려고","was":"회원가입·프로필에 카톡 아이디를 받아 단톡 신청자와 앱 계정을 맞추려 함. 미입력 시 알림도 있었음.","now":"카톡 아이디 컬럼과 입력 UI, 관련 안내를 제거함. 신원은 학번·실명만 사용함.","gone":"profiles 카카오 아이디, 카톡 미입력 알림, 가입 시 카톡 필드"},{"what":"웹·앱 푸시와 개인 알림 종류(활동일·레슨·공지) 설정","why":"기기에서 바로 받게 하고, 받기 싫은 종류는 끄게 하려고","was":"알림 채널이 카톡 챗봇에 묶여 있었음. 브라우저·앱에서 종류별로 끄고 켜는 설정이 없었음.","now":"웹 Push와 Expo Push를 사용함. 활동일/레슨/공지를 종류별로 켜고 끌 수 있음. 활동 알림에 참석/불참 버튼이 있음.","gone":null},{"what":"계정 삭제 안내 페이지, 운영 메모","why":"개인정보 처리와 운영 인수인계를 남기려고","was":"계정 삭제 경로와 안내가 부족했음. 삭제 대상 데이터를 화면에서 확인하기 어려웠음.","now":"계정 삭제 페이지와 운영 메모를 남김.","gone":null}],"story":"카카오 비즈니스 채널 챗봇으로 참석·현황을 받으려다, 채널 정책과 유지비가 동아리 규모에 맞지 않아 해당 방향을 접은 구간임.\n\n챗봇 서버·관리 패널·카톡 아이디 입력은 코드와 프로필에서 제거하고, 개인 알림은 웹 푸시와 앱(Expo) 푸시로 남김. 활동 알림에 참석/불참 버튼을 붙임. 이후 ‘구독 수’ 집계는 1.2에서 사람/기기로 재구분함."},{"id":"0.9","date":"2026-08-20","title":"웹앱 설치·운영 도구","purpose":"Play 스토어 전에 브라우저 홈 화면 추가로 쓰게 하고, 달력·피크·데모 모드를 정리함.","changes":[{"what":"Android/iPhone별 홈 화면 추가 안내, 웹 아이콘을 Drop 로고로","why":"스토어 앱 없이 알림까지 쓰려면 기기마다 설치 방법이 달라서","was":"브라우저에서 알림을 쓰려면 홈 화면 추가 방법이 기기마다 달랐고, 앱 안에 안내가 없었음. 웹 아이콘도 Drop 로고가 아니었음.","now":"Android/iPhone별 홈 화면 추가 안내를 넣음. 웹 아이콘을 Drop 로고로 맞춤.","gone":null},{"what":"활동 시간 외에는 ‘갈 예정’ 인원 표시, 실패한 푸시 토큰만 정리","why":"당일 전에 몇 명이 오는지 보고, 죽은 토큰으로 발송이 실패하지 않게","was":"활동 시간 전에 예정 인원이 홈에 보이지 않았고, 만료된 푸시 토큰이 쌓여도 삭제하지 않음.","now":"시간 외 ‘갈 예정’ 인원 표시 초안과, 발송 실패 토큰만 정리하는 초안을 넣음.","gone":null},{"what":"운영진 데모 모드를 헤더 토글로, 출석 우회 정리","why":"개발용 우회가 일반 화면에 섞이지 않게","was":"개발용 출석 우회가 일반 화면에 섞여 있었음. 운영이 아닌 사람도 우회를 볼 여지가 있었음.","now":"운영진 데모 모드를 헤더 토글로 분리함.","gone":"일반 화면의 출석 우회 버튼"},{"what":"설정 달력, 피크 시간, 휴관·추가 활동일 푸시 예약","why":"휴관 공지와 피크 예약 제한을 날짜 단위로 맞추려고","was":"휴관·피크를 날짜 단위로 다루기 어려웠음. 추가 활동일 푸시를 예약할 화면이 없었음.","now":"설정 달력, 피크 시간, 휴관·추가 활동일 푸시 예약을 넣음.","gone":null}],"story":"Play 스토어 이전에 PWA 홈 화면 추가를 안내하고, 달력·피크·데모 모드를 정리한 구간임.\n\n이후 네이티브 스토어 앱과 웹 코드가 같아지면, 앱 안의 웹 설치 안내는 1.1에서 다시 제거함. 시간 외 ‘갈 예정’ 인원과 실패 푸시 토큰 정리는 여기서 초안을 넣고, 1.2에서 사람/기기·만료 기기만 삭제하는 쪽으로 구체화함."},{"id":"1.0","date":"2026-08-21 ~ 08-22","title":"테마·코트 빛·회전","purpose":"화면을 동아리 톤에 맞추고, 휴대폰에서 시스템 회전이 막히지 않게 함.","changes":[{"what":"라이트/다크 테마, 코트 테두리만 마우스를 따라 빛남","why":"코트 전체가 밝아지면 산만해서, 가장자리만 강조하려고","was":"코트가 통째로 밝아지거나, 마우스 광원이 코트 안을 원형으로 비춤. 테마가 시스템과 따로 동작할 수 있었음.","now":"시스템 라이트/다크를 따름. 코트는 마우스 근처 테두리만 빛남.","gone":"코트 전체 발광, 마우스 원형 스포트라이트"},{"what":"로그인 기억하기. 기억 시 로컬 세션만 유지","why":"같은 폰에서 다시 열 때 매번 학번을 치지 않게. 서버에서 토큰을 끊으면 기억이 풀려서","was":"동일 기기에서도 앱을 다시 열면 학번을 재입력함. 세션을 기기에 남길지 선택할 수 없었음.","now":"로그인 화면에 기억하기 체크를 넣음. 기억 시 로컬 세션만 유지하고, 서버가 토큰을 끊으면 해제됨.","gone":null},{"what":"웹앱이 방향을 잠그지 않고 OS 수동 회전에 맡김","why":"크롬 탭에는 회전 버튼이 있는데, 설치 웹앱이 방향을 가로채면 버튼이 안 나와서","was":"설치 웹앱이 화면 방향을 잠금. Android 크롬의 수동 회전 버튼이 나오지 않음.","now":"웹앱이 방향을 잠그지 않음. OS 수동 회전에 맡김.","gone":"웹앱 orientation lock"},{"what":"폰 가로는 데스크톱 셸이 아니라 세로 스크롤 코트 화면","why":"가로로 돌리면 너비 768을 데스크톱으로 착각해 레이아웃이 깨져서","was":"폰을 가로로 돌리면 너비 768을 데스크톱으로 착각해 왼쪽 사이드바가 뜸. 코트 화면이 깨짐.","now":"폰 가로는 세로 스크롤 코트 화면을 유지함. 넓은 PC만 사이드바를 사용함.","gone":"폰 가로=데스크톱 셸로 오판하던 분기"}],"story":"라이트/다크와 코트 테두리 빛, 로그인 기억, 웹앱 회전을 OS에 맡기는 구간임.\n\n코트 전체를 밝히는 스포트라이트와 마우스 원형 광원은 넣었다가 테두리만 남기고 삭제함. 설치 웹앱이 화면 방향을 잠그면 크롬의 수동 회전 버튼이 나오지 않아 orientation lock도 제거함."},{"id":"1.1","date":"2026-08-22 ~ 08-23","title":"도메인·가입 명단·역할 분리 (작업 반영)","purpose":"공식 주소로 쓰고, 가입을 동아리 명단으로 조일 준비를 하며, 관리자/운영자와 회비 등급을 헷갈리지 않게 함. 이 구간은 아직 원격 Git에 안 올라간 로컬 변경을 포함함.","changes":[{"what":"Android 릴리즈에 R8 난독화·리소스 축소. EAS versionCode 12.","why":"Play Console이 최적화 미사용을 경고해서","was":"Play Console이 릴리즈에 R8 미사용을 경고함. 패키지 크기와 난독화가 스토어 권장과 달랐음.","now":"릴리즈 minify·리소스 축소, versionCode 12를 적용함.","gone":null},{"what":"앱 화면에서 웹앱 설치 안내 카드·문구를 제거.","why":"나중에 Play 앱과 웹이 같은 코드일 때 스토어 앱이 웹사이트 설치를 권하지 않게","was":"앱 화면에 웹앱 설치(홈 화면 추가) 카드와 안내 문구가 있었음. 0.9에서 넣은 PWA 안내가 그대로 남아 있었음.","now":"네이티브 스토어 앱과 웹이 같은 코드를 쓸 때를 대비해 앱 안의 설치 안내를 제거함. 브라우저 홈 화면 추가는 OS 기능으로만 함.","gone":"PwaInstallCard, 앱 안 홈 화면 추가 문구"},{"what":"학번+실명 명단 테이블(club_roster)과 관리자 붙여넣기. 명단으로 가입을 막는 스위치는 기본 꺼짐.","why":"아무 학번이나 가입하는 것을 나중에 막을 수 있게, 지금은 명단만 쌓아 두려고","was":"임의 학번으로 가입할 수 있었음. 동아리 명단으로 가입을 막을 테이블이 없었음.","now":"club_roster(학번+실명)와 관리자 붙여넣기를 추가함. 명단으로 가입을 막는 스위치는 기본 꺼짐이며, 켜기 전에는 기존과 같이 가입됨.","gone":null},{"what":"공식 주소를 dgistdrop.com으로 고정. 가비아 구매, Cloudflare 연결. README·개인정보·계정삭제 안내에서 pages.dev를 빼 둠.","why":"pages.dev는 임시 배포처럼 보여 단톡·안내에 쓰기 어려워서","was":"공개 주소가 pages.dev 임시 배포처럼 문서에 남아 있었음. 고정 도메인이 안내의 기준이 아니었음.","now":"dgistdrop.com을 공식 주소로 고정함. 가비아+Cloudflare. 대외 문서에서 pages.dev 표기를 제거함.","gone":"대외 안내용 *.pages.dev 표기"},{"what":"profiles에 is_admin / is_operator를 두고, membership_tier는 게스트·준회원·정회원만 사용. 관리자 배지는 ‘비회원’이 아니라 ‘관리자’. 정회원/준회원 버튼은 회비 등급만 바꿈.","why":"membership_tier에 admin을 넣으면 회비 등급을 바꿀 때 권한이 같이 빠졌기 때문에","was":"membership_tier에 admin이 들어 있어, 정회원 버튼을 누르면 관리 권한이 함께 해제됨. 관리자 배지가 비회원처럼 보이기도 함.","now":"is_admin / is_operator와 회비 등급(게스트·준회원·정회원)을 분리함. 배지는 관리자·운영자로 표시함.","gone":"membership_tier = admin 을 권한으로 쓰던 방식"},{"what":"학번 202662024 운영자는 등급 변경·관리자 토글로 운영자/관리자가 해제되지 않음. DB 트리거 guard_owner_operator.","why":"최상위 계정이 실수로 일반 회원이 되지 않게","was":"운영자 학번을 정회원으로 바꾸면 운영자(및 관리) 권한이 해제됨. 실수로 권한을 잃을 수 있었음.","now":"학번 202662024는 guard_owner_operator로 운영자/관리자가 해제되지 않음.","gone":null},{"what":"관리자 해제는 관리자 버튼을 다시 눌렀을 때만. 정회원 버튼은 권한 회수가 아님.","why":"정회원 버튼을 권한 회수로 쓰지 않게","was":"정회원 버튼이 권한 회수로 쓰일 수 있었음. 회비 등급과 관리 해제가 한 버튼에 섞임.","now":"관리자 해제는 관리자 버튼을 다시 눌렀을 때만 됨. 정회원은 회비 등급만 변경함.","gone":null},{"what":"게스트는 서울 날짜가 바뀌면 자동 삭제. 운영자여도 게스트면 일괄 삭제 대상.","why":"게스트는 당일 임시라 쌓아 둘 데이터가 없고, 권한으로 남는 구멍을 없애려고","was":"게스트 계정이 날짜가 바뀌어도 쌓임. 운영자 권한을 가진 게스트도 남을 수 있었음.","now":"서울 날짜가 바뀌면 게스트를 일괄 삭제함. 운영자여도 게스트면 삭제 대상임.","gone":"게스트 장기 유지"},{"what":"기본 정기 활동을 매주 월·수 18:30–21:40으로 변경. 시간 슬라이더는 21:40까지 선택 가능.","why":"실제 정기 활동 요일·종료 시각이 화·목 21:50이 아니어서","was":"기본 정기 활동이 화·목, 종료 시각이 21:50 쪽에 가깝게 남아 있었음. 슬라이더 상한도 그에 맞춰져 있었음.","now":"매주 월·수 18:30–21:40으로 기본값을 변경함. 시간 슬라이더는 21:40까지임.","gone":"기본값 화·목 및 21:50 종료"},{"what":"변경 이력 PDF(docs/CHANGELOG.pdf)와 releases.json 자동 생성 규칙.","why":"버전마다 무엇을 왜 바꿨는지 운영진이 한 문서로 보게","was":"버전별 변경 내역을 운영진이 볼 내부 문서가 없었음. Git 로그만 있었음.","now":"docs/changelog/releases.json을 고치면 CHANGELOG.pdf를 다시 만드는 규칙을 넣음.","gone":null},{"what":"코트 예약 기본값을 끔. 홈은 현황 모드(비어 있음/사용 중만, 이름 없음). 사용 여부는 운영진이 rpc로 바꿈. reservation_enabled 기본 false.","why":"현장에서 예약을 강제하기 어렵고, 이름 없이 사용 여부만 보면 되어서","was":"홈이 코트 예약이 기본이었음. 예약자 이름·사용자 정보가 현황 화면에 보일 수 있었음. 현장에서 예약을 강제하기 어려웠음.","now":"reservation_enabled 기본값을 false로 함. 홈은 비어 있음/사용 중만 표시함. 운영진이 occupancy RPC로 사용 여부를 변경함.","gone":"기본 예약 강제, 현황 모드에서의 이름·예약자 표시"},{"what":"승인 전에도 관리자/운영자면 배지가 관리자·운영자. 게스트만 게스트로 표시. 출석 카드 스태프 판별은 isStaffUser.","why":"권한이 있는 사람이 비회원처럼 보이던 표시를 없애려고","was":"승인 전 관리자/운영자가 배지상 비회원처럼 보임. 출석 카드의 스태프 판별도 승인 상태에 묶여 있었음.","now":"승인 전이라도 관리자/운영자 배지를 표시함. 출석 스태프 판별은 isStaffUser를 사용함. 게스트만 게스트로 표시함.","gone":null},{"what":"프로필 오늘 참석: 참석/불참을 먼저 고르고, 참석이면 그 아래 시간 슬라이더. 입장 팝업(AttendanceIntentGate)과 같은 순서.","why":"올 사람 수와 친구용 시간을 나누고, 푸시 참석 버튼과 맞추려고","was":"오늘 참석에서 시간부터 고르거나, 입장 팝업(AttendanceIntentGate)과 프로필 카드의 질문 순서가 달랐음. 올 사람 수와 친구용 시간이 한 제스처에 섞임.","now":"참석/불참을 먼저 고르고, 참석이면 그 아래 시간 슬라이더가 나옴. 입장 팝업과 동일한 순서임.","gone":null},{"what":"시간 눈금은 시작·끝 시각만 표시. 관리 화면 활동 시간은 요일 칩 + 시작/끝 한 구간.","why":"글자가 겹치고 설정 카드가 많아 보이던 것을 줄이려고","was":"시간 눈금에 중간 시각 글자가 겹침. 관리 화면 활동 시간 카드가 요일마다 따로 많아 보임.","now":"눈금은 시작·끝 시각만 표시함. 관리 화면은 요일 칩 + 시작/끝 한 구간임.","gone":null},{"what":"포인트 기능을 끄면 상점·내역·적립·차감 UI와 pointLedger 반영을 모두 숨김.","why":"배타 기능인데 일부 화면에 포인트가 남아 있어서","was":"포인트 기능을 꺼도 상점·내역·적립·차감 UI가 일부 화면에 남고, pointLedger 반영도 보일 수 있었음.","now":"끄면 관련 UI와 pointLedger 반영을 모두 숨김.","gone":"포인트 OFF 상태의 잔여 상점·내역 UI"},{"what":"README를 dgistdrop.com 회원 안내·배포 과정 중심으로 다시 씀. 시크릿·service_role은 올리지 말 것을 명시.","why":"GitHub가 개발자 메모가 아니라 배포 사이트 설명이 되게","was":"README가 개발자 메모에 가까웠음. 시크릿·service_role을 올리지 말 것이 분명하지 않았음.","now":"dgistdrop.com 회원 안내와 배포 과정 중심으로 재작성함. 시크릿·service_role은 커밋하지 말 것을 명시함.","gone":null},{"what":"참석 여부·입장 팝업은 정기 활동일 또는 달력에 추가된 활동일에만. 그날 아니면 버튼 없이 안내 문구만.","why":"활동이 없는 날에 ‘오늘 오시나요?’를 묻지 않게","was":"활동이 없는 날에도 ‘오늘 오시나요?’ 팝업과 참석 버튼이 나옴.","now":"정기 활동일 또는 달력에 추가된 활동일에만 참석 팝업·버튼이 나옴. 해당일이 아니면 안내 문구만 있음.","gone":"비활동일의 참석 질문"},{"what":"예약 기능(데모)·포인트 상점(데모)·Elo 스위치를 관리 → 개발자 탭으로 옮기고 운영자만 변경 가능.","why":"Elo처럼 실험 기능으로 켜고 끄되, 일반 관리자가 실수로 바꾸지 않게","was":"예약 기능(데모)·포인트 상점(데모)·Elo 스위치가 일반 관리 화면에 섞일 수 있었음. 일반 관리자가 실수로 변경할 수 있었음.","now":"관리 → 개발자 탭으로 옮김. 운영자만 변경 가능함.","gone":null}],"story":"공식 주소 dgistdrop.com, 가입 명단 테이블, 관리자/운영자와 회비 등급 분리, 코트 예약 기본 해제(현황 모드), 게스트 서울 날짜 삭제, 월·수 18:30–21:40이 이 구간에 모임.\n\n학번 202662024 운영자는 등급 버튼으로 권한이 해제되지 않음. membership_tier에 admin을 넣던 방식은 삭제하고, is_admin / is_operator와 게스트·준회원·정회원을 구분함. 앱 안의 PWA 설치 카드도 이 구간에서 제거함."},{"id":"1.2","date":"2026-08-24","title":"이용 문구·이력·탭 안내","purpose":"현황 모드에 맞춰 화면 문구를 정리하고, 변경 이력을 문서형 사이트로 자세히 적으며, 첫 로그인 탭 안내와 올 사람 명단을 넣음.","changes":[{"what":"코트 상세에서 ‘이름은 표시하지 않아요. 운영진이 사용 여부를 바꿉니다.’, ‘누가 쓰는지는 표시하지 않아요’ 등 부가 설명을 삭제. 상태는 비어 있음/사용 중만. 운영진만 ‘사용 중으로 표시’·‘코트 비우기’.","was":"코트 상세에 ‘이름은 표시하지 않아요. 운영진이 사용 여부를 바꿉니다.’, ‘누가 쓰는지는 표시하지 않아요’ 같은 부가 설명이 남아 있었음. 현황 모드인데도 개발 중 헬퍼처럼 보임.","now":"상태는 비어 있음/사용 중만 표시함. 운영진에게만 ‘사용 중으로 표시’·‘코트 비우기’가 있음. 일반 회원 화면에는 해당 설명을 쓰지 않음.","gone":"사용자용 개발 중 헬퍼 문구(이름 미표시·누가 쓰는지 미표시 안내)"},{"what":"사이드바·홈 제목을 ‘코트 예약’에서 ‘코트 현황’으로 변경. 게스트 로그인·MY 게스트 카드 문구를 현황 보기·당일 삭제(서울 날짜 변경)에 맞춤.","was":"사이드바와 홈 제목이 ‘코트 예약’이었음. 게스트 로그인·MY 게스트 카드 문구도 예약을 전제로 함.","now":"제목을 ‘코트 현황’으로 변경함. 게스트는 현황 보기와 당일 삭제(서울 날짜 변경)를 안내함.","gone":"네비게이션·홈의 ‘코트 예약’ 라벨, 예약 전제 게스트 카피"},{"what":"이용 안내: 기본이 현황 모드, 오늘 참석(활동일만), 올 사람 vs 지금, 회비 등급과 관리자/운영자 분리, 게스트 당일 삭제를 추가. 예약·난타/경기·합류·포인트 예약 규칙은 해당 기능이 켜져 있을 때만 표시.","was":"이용 안내가 예약·난타/경기·합류·포인트 규칙을 기능이 꺼져 있어도 항상 표시함. 현황이 기본인 것과 맞지 않음. 올 사람과 지금, 회비 등급과 관리자/운영자 차이, 게스트 당일 삭제가 안내에서 빠지거나 약했음.","now":"기본이 현황 모드임을 기재함. 오늘 참석(활동일만), 올 사람 vs 지금, 회비 등급과 관리자/운영자 분리, 게스트 당일 삭제를 추가함. 예약·난타/경기·합류·포인트 규칙은 해당 기능이 켜져 있을 때만 표시함.","gone":"꺼진 기능의 예약·난타·포인트 규칙 문구"},{"what":"개발 콘솔 Require cycle 경고 제거(persistGate·authBridge 등으로 스토어 순환 import 분리). 개발 모드에서 PWA 서비스 워커를 등록하지 않고 기존 등록을 해제(가짜 504 제거). pointerEvents를 style로 이동.","was":"개발 콘솔에 Require cycle 경고가 남. 개발 모드에서도 PWA 서비스 워커가 등록되어 가짜 504가 발생함. pointerEvents를 props로 넘겨 콘솔 경고가 남.","now":"persistGate·authBridge 등으로 스토어 순환 import를 분리함. 개발 모드에서는 서비스 워커를 등록하지 않고 기존 등록을 해제함. pointerEvents는 style로 옮김.","gone":"개발 중 서비스 워커 fetch 가로채기(가짜 504), 순환 import 경고의 원인 구조"},{"what":"변경 이력 PDF는 변경 내용만 자세히 적고 사유 열을 빼 둠. README에 회원 표·역할·게스트 삭제·현황 기본·034 SQL·set_config 안내를 보강.","was":"변경 이력 PDF에 사유(why) 열이 있어 표가 빽빽했음. README에 회원 표·역할·게스트 삭제·현황 기본·034 SQL·set_config가 짧거나 없었음.","now":"PDF는 변경 내용만 자세히 적고 사유 열을 뺌. README에 회원 표·역할·게스트 삭제·현황 기본·034 SQL·set_config 안내를 보강함.","gone":"PDF 사유(why) 열"},{"what":"관리 → 알림 등록 현황: 사람 수와 기기 수를 나눠 표시. 같은 사람의 여러 기기(앱·웹·폰 여러 대)는 모두 유지. 미승인·게스트 등록과 만료된 기기(발송 실패)만 정리. 60일 넘은 발송 기록 삭제.","was":"관리 → 알림 등록 현황이 ‘구독’ 수 하나로 부풀어 보임. 동일인이 앱·웹·폰 여러 대를 쓰면 숫자가 사람 수처럼 커짐. 재등록 시 같은 플랫폼의 다른 기기를 지워, 폰을 두 대 쓰면 한쪽이 끊김. 만료 기기와 미승인 등록이 한 덩어리로 보임.","now":"사람 수와 기기 수를 나눠 표시함. 동일인의 여러 기기(앱·웹·폰 여러 대)는 모두 유지함. 미승인·게스트 등록과 발송 실패 기기만 정리함. 60일이 지난 발송 기록은 삭제함.","gone":"알림 화면의 ‘구독’ 단일 집계, 같은 사람·같은 플랫폼에서 최신만 남기던 중복 삭제"},{"what":"이용 안내 맨 아래에 ‘소프트웨어 변경 이력’ 작은 링크. 누르면 앱과 분리된 새 탭(/history/)에서 버전 나무·타임라인 카드로 이력을 봄.","was":"운영진이 Git 이력과 PDF만 볼 수 있었음. 앱 안에서 이력으로 가는 링크가 없었고, 브라우저용 이력 페이지도 없었음.","now":"이용 안내 맨 아래에 ‘소프트웨어 변경 이력’ 링크를 넣음. 누르면 앱 셸과 분리된 새 탭(/history/)이 열림.","gone":null},{"what":"학번 계정 첫 로그인(또는 아직 안 본 회원)에 탭 5개를 한 줄씩 안내. 게스트·관리 탭은 없음. 건너뛰기 가능. 이용 안내 하단에서 다시 보기. 홈 「올 사람」을 누르면 오늘 참석한 사람 명단.","was":"학번 계정 첫 로그인에 탭 안내가 없었음. 홈 「올 사람」은 숫자만 보이고, 참석자 명단을 눌러 볼 수 없었음. 안내 말풍선이 있었다면 화면 한가운데에 고정됐을 것임.","now":"학번 계정 첫 로그인(또는 미열람 회원)에 탭 5개를 한 줄씩 안내함. 게스트·관리 탭은 없음. 건너뛰기 가능하며, 이용 안내 하단에서 다시 볼 수 있음. 말풍선은 데스크톱 사이드바 버튼 오른쪽, 모바일에선 하단 탭 위에 붙고, 단계 변경 시 페이드 아웃 후 페이드 인함. 홈 「올 사람」을 누르면 아래에서 당일 참석자 이름이 나옴. 안내 문구에도 해당 동작을 기재함.","gone":null},{"what":"변경 이력 사이트(/history/)를 문서형 다크 UI로 다시 짬. 각 항목은 이전 상태를 ‘해서’로 이어서 변경을 한 문장으로 적고, 삭제가 있으면 따로 표시함.","was":"/history/가 카드·타임라인 위주라 개발 문서처럼 보이지 않음. 각 줄이 한 문장 요약이라, 이전 상태와 삭제 항목을 사이트에서 읽기 어려웠음.","now":"Supabase 문서 다크 톤에 가깝게 재구성함. 왼쪽(모바일은 위)에 버전 목록, 본문에 상세 설명, 스크롤 페이드, 주제 흐름 그래프를 사용함. 각 항목은 이전 문장에 ‘해서’를 붙여 변경을 한 줄로 이음. 삭제는 따로 표시함.","gone":"이력 사이트의 카드형 타임라인 UI"},{"what":"이력 사이트 순서를 위가 v0.1, 아래가 최신으로 맞춤. 주제 그래프도 세로 시간축.","was":"이력 사이트 사이드바·본문은 최신이 위였고, 그래프는 왼쪽이 옛날이라 읽는 방향이 달랐음.","now":"위가 v0.1, 아래가 최신. 그래프도 세로 시간축으로 동일함.","gone":null},{"what":"홈 「올 사람」 명단은 화면 아래 시트. 사람이 적으면 짧게, 많으면 그 안에서만 스크롤.","was":"홈 「올 사람」 명단이 화면 가운데 큰 모달이라, 인원이 적어도 칸이 컸음.","now":"하단에서 시트만 올라옴. 배경은 제자리에서 약하게 흐림. 인원이 적으면 짧게, 많으면 그 안에서만 스크롤함.","gone":"가운데 고정 높이 올 사람 모달"},{"what":"홈 「올 사람」 옆에, 활동일의 활동 푸시 시각(관리 설정의 알림 시각)부터 활동 시작 전까지 ‘눌러서 누가 오는지 확인해보세요!’를 연하게 천천히 깜박임.","was":"홈 「올 사람」은 숫자와 라벨만 보여, 눌러야 명단이 나온다는 점을 계속 알려 주지 않음. 안내를 하루 종일 두면 산만함.","now":"활동일에만, 관리 설정의 활동 푸시 시각부터 활동 시작 시각까지 「올 사람」 옆에 ‘눌러서 누가 오는지 확인해보세요!’를 연하게 천천히 깜박임. 안내를 눌러도 명단이 열림.","gone":null},{"what":"다크 모드에서 관리 화면·시간 선택 칸의 흰 박스를 어두운 톤으로 맞춤. 시간 칸 사이 구분선을 더 잘 보이게 함. 관리 → 현장 코트 대기열은 라이트처럼 카드와 살짝 다른 칸으로 둠.","was":"다크 모드에서도 관리 달력·대기 칸·경고 박스와 시간 선택 막대가 연한 흰색(#E8EAEF 등)으로 남아 눈에 띔. 시간 칸 사이 선은 흰 반투명이라 거의 안 보임.","now":"해당 박스는 다크 표면·세이지 톤으로 맞춤. 시간 칸은 어두운 미선택/선택 색을 쓰고, 칸 사이 구분선을 더 진하게 둠. 관리 → 현장 코트 대기열은 라이트처럼 카드와 살짝 다른 칸으로 둠.","gone":null},{"what":"모바일 하단 탭(MY·이용 안내 등)을 눌러도 페이지를 다시 열지 않고, 앱 안에서만 탭을 바꿈. 로그인 정보를 탭마다 다시 불러오지 않음.","was":"모바일 하단 탭이 링크(<a href>)로 그려져, MY·이용 안내 등을 누르면 문서를 다시 열고 로그인·세션을 처음부터 복구함.","now":"탭은 앱 안에서만 전환함. 페이지를 다시 열지 않아 로그인 정보를 탭마다 다시 가져오지 않음.","gone":null},{"what":"포인트 기능이 꺼져 있으면 MY의 봉사·소모품(청소·네트·셔틀콕)도 같이 숨김. 회원 관리에서 운영자 부여·회수를 없애고 운영자 권한은 고정만 표시.","was":"포인트 스위치를 꺼도 MY에 봉사·소모품(청소·네트·셔틀콕) 칸이 남음. 회원 관리에서 운영자 권한을 부여·회수할 수 있었음.","now":"포인트가 꺼져 있으면 봉사·소모품도 같이 숨김. 운영자 권한은 고정이며 화면에서 부여·회수하지 않음.","gone":"회원 관리의 운영자 부여·회수 버튼"},{"what":"모바일 탭에서 href와 커스텀 버튼을 같이 써서 첫 로드에 나던 오류를 없앰. 숨기는 탭만 href: null, 보이는 탭만 커스텀 버튼을 씀.","was":"모바일 탭이 숨김용 href: null과 커스텀 버튼을 한 화면에 같이 써서, 로그인 복구 전 첫 로드에 ‘Cannot use href and tabBarButton together’가 남.","now":"숨기는 탭은 href: null만, 보이는 탭은 커스텀 버튼만 씀. 첫 로드 오류가 나지 않음.","gone":null}],"story":"현황 모드에 맞춰 화면에 남은 ‘개발 중’ 설명을 지우고, 콘솔 경고를 줄이며, 변경 이력을 사이트와 PDF로 나누고, 푸시 기기 정리와 첫 로그인 탭 안내를 넣은 구간임.\n\n알림 화면의 ‘구독’ 표기를 사람 수와 기기 수로 변경함. 동일인의 앱·웹·복수 폰은 삭제하지 않음. 미승인·게스트 등록과 발송 실패 기기만 정리함.\n\n홈 「올 사람」을 누르면 화면 아래에서 당일 참석자 이름이 나옴. 활동일에는 활동 푸시 시각부터 활동 시작 전까지 「올 사람」 옆에 눌러 보라는 안내가 연하게 깜박임. 탭 안내 말풍선은 사이드바(모바일은 하단 탭) 버튼 옆에 붙고, 단계 변경 시 페이드 아웃 후 페이드 인함. 변경 이력 사이트(/history/)는 앱 셸 밖의 문서형 다크 페이지이며, 위가 이른 버전·아래가 최근임. 항목은 이전 상태를 ‘해서’로 이어서 한 문장으로 적고, 삭제가 있으면 따로 표시함. 다크 모드에서는 관리 화면과 시간 선택 칸의 흰 박스를 어두운 톤으로 맞추고, 시간 칸 구분선을 더 잘 보이게 함. 모바일 하단 탭은 페이지를 다시 열지 않고 앱 안에서만 바꿈. 포인트가 꺼져 있으면 봉사·소모품도 숨기고, 운영자 권한은 화면에서 부여하지 않음."},{"id":"1.3","date":"2026-08-24","title":"안드로이드 활동 알림 버튼","purpose":"활동 푸시에서 참석·불참을 알림 자체에서 고를 수 있게 함.","changes":[{"what":"웹앱 활동 알림(자동·수동)을 펼치면 참석/불참 버튼이 붙도록 서비스 워커와 발송 값을 맞춤. 버튼을 누르면 오늘 참석 의사가 반영됨.","was":"웹앱 활동 푸시에 글만 보이거나, 참석/불참 버튼이 서비스 워커에 안 붙는 경우가 있음.","now":"활동 알림(자동·수동)은 알림을 펼치면 참석/불참 버튼이 붙음. 버튼을 누르면 오늘 참석 의사가 반영됨.","gone":null},{"what":"안드로이드 스토어/APK 앱의 활동·출석 푸시를 펼치면 참석/불참 버튼이 보임. 버튼을 누르면 오늘 참석 의사가 반영됨.","was":"안드로이드 활동 푸시에 글만 보이고, 알림을 펼쳐도 참석/불참 버튼이 없음.","now":"스토어/APK 앱에서 활동·출석 푸시를 펼치면 참석/불참 버튼이 보임. 버튼을 누르면 오늘 참석 의사가 반영됨.","gone":null},{"what":"관리 → 알림 등록 현황을 토큰 모양으로 앱/웹/기타로 나누고, 미승인·게스트와 같은 사람의 여분 웹 구독(최근 3개 초과)을 따로 세어 정리할 수 있게 함. 기기 많은 사람 목록을 보여 줌.","was":"알림 등록 현황이 platform 값만 세어 앱/웹이 어긋날 수 있음. 정리 버튼은 미승인·게스트만 지워, 승인 회원의 죽은 웹 구독이 많아도 ‘지울 등록이 없어요’만 나옴.","now":"토큰 모양으로 앱/웹/기타를 나눔. 미승인·게스트 수와 같은 사람의 여분 웹 구독(최근 3개 초과)을 보여 주고, 정리 때 같이 지움. 기기 많은 사람 목록을 보여 줌.","gone":null}],"story":"안드로이드 원격 푸시는 시스템에 글만 그려져 참석/불참 버튼이 붙지 않았음. 이 구간에서 활동·출석 푸시는 데이터만 보내고, 앱이 버튼이 있는 알림을 기기에 다시 그리게 함."},{"id":"1.4","date":"2026-08-24","title":"출석 버튼·한국 날짜","purpose":"출석완료·미도착이 당일 기준으로 맞게 바뀌고, 데모를 끄면 출석 버튼이 다시 잠기게 함.","changes":[{"what":"출석완료는 한국 날짜 기준으로 바로 표시. 관리자 데모를 끄면 출석 버튼이 다시 비활성화됨. 체육관에 있을 때만 다시 켜짐.","was":"출석완료·오늘 출석 목록이 UTC 날짜라 한국 오전에는 안 맞음. 관리자 데모를 끄면 출석 버튼이 켜진 채로 남음.","now":"출석은 한국 날짜로 맞춰 바로 표시함. 데모를 끄면 출석 버튼이 잠기고, 실제 체육관 근처일 때만 다시 켜짐.","gone":null},{"what":"같은 사람의 PC 웹 구독(크롬 탭·웹앱)은 하나만 남김. 관리 → 알림에 「웹은 사람당 하나만」을 넣어, 폰·PC 웹을 합쳐 최근 웹 구독 하나만 남길 수 있음.","was":"한 사람이 크롬 탭과 PC 웹앱·예전 브라우저 구독을 여러 개 갖고 있으면 알림이 여러 번 감. 정리는 웹 구독 3개까지 남김.","now":"같은 사람의 같은 환경(PC/안드/아이폰) 웹 구독은 최근 하나만 남김. 폰과 PC는 각각 하나씩 유지.","gone":null}],"story":"출석 기록이 UTC 날짜를 써서, 한국 오전에는 출석완료가 안 바뀌거나 미도착과 어긋남. 데모를 꺼도 가상 위치가 남아 출석 버튼이 켜진 채로 남음."},{"id":"1.5","date":"2026-08-24","title":"웹 푸시 사람당 1개","purpose":"한 사람에게 웹 구독이 수십 개 쌓이지 않게 자동으로 막음.","changes":[{"what":"웹 푸시는 사람당 최근 구독 1개만 유지(PC·폰 웹 합산). 알림을 켤 때·관리 정리·활동 알림 발송 때 여분을 지움."},{"what":"관리 → 알림의 「못 쓰는 등록 정리」가 여분 웹까지 한 번에 지움. Supabase에 037_web_push_one_per_user.sql 적용 필요."}]},{"id":"1.6","date":"2026-08-24","title":"참석 시간 팝업·칸 선택","purpose":"푸시에서 참석을 고르면 언제 올지 바로 묻고, 시간 칸과 올 사람 시각 표시를 바로잡음.","changes":[{"what":"알림에서 참석을 누르면 앱이 열릴 때 프로필과 같은 시간 칸 팝업이 나옴. 알림함을 프로필로 보내지 않음."},{"what":"시간 칸은 드래그로 지나간 칸만 칠함. 빈 칸에서 시작하면 켜고, 켜진 칸에서 시작하면 끔. 손대지 않은 칸은 그대로 둠. 한 칸을 누르면 그 칸만 바뀜."},{"what":"시간 팝업은 참석과 따로, 위 X나 「건너뛰기」로 닫을 수 있음. 참석은 유지되고 시각만 비움."},{"what":"올 사람 명단·친구 도착 시각에서 초(:00)를 숨기고 HH:MM만 보여 줌. DB의 18:30:00도 칸에 맞게 맞춤."}]},{"id":"1.7","date":"2026-08-24","title":"활동 알림 {time}은 시작 시각","purpose":"활동 푸시 본문의 시각을 자동 발송 시각이 아니라 당일 활동 시작으로 맞춤.","changes":[{"what":"활동 알림 미리보기·수동 발송의 {time}을 자동 발송 시각이 아니라 당일 첫 활동 시작(예: 18:30)으로 넣음."}]},{"id":"1.8","date":"2026-08-24","title":"활동 알림 미리보기 버튼","purpose":"관리 화면에서 실제 푸시와 같은 문장·참석/불참 버튼을 보게 함.","changes":[{"what":"알림 설정 템플릿 아래에 보낼 문장을 활동 시작 시각으로 채워 보여 줌. 미리보기와 발송이 같은 문장을 씀."},{"what":"설정 미리보기와 발송 화면에 참석/불참 버튼을 알림처럼 보여 줌. 오늘 취소면 버튼은 숨김."}]},{"id":"1.9","date":"2026-08-24","title":"활동 취소 당일은 알림 없음","purpose":"오늘 활동을 취소하면 활동 푸시가 나가지 않고, 취소는 그날만 적용되게 함.","changes":[{"what":"오늘 활동 취소면 자동·수동 활동 알림을 보내지 않음. 참석/불참 팝업도 당일은 묻지 않음. 날짜가 바뀌면 취소가 풀림."}]},{"id":"1.10","date":"2026-08-24","title":"취소 안내와 활동일 디테일","purpose":"활동을 취소하면 회원에게 안내가 가게 하고, 참석·올 사람·자동 발송이 한국 날짜와 취소 상태를 바로 따르게 함.","changes":[{"what":"관리자가 오늘 활동을 취소하면 참석/불참 없는 취소 안내를 보냄. 활동 알림은 그대로 안 감. 안내를 다시 보낼 수 있음."},{"what":"웹 알림에서 제목에 「활동」이 있어도 취소·휴관·공지는 참석/불참 버튼을 달지 않음. 취소 알림은 이전 활동 알림을 덮음."},{"what":"푸시 마스터가 꺼지면 휴관·추가 활동일 자동 발송도 멈춤. 추가 활동일은 달력 본문이 있으면 그 문장을 씀."},{"what":"다른 기기가 취소·일정·달력을 바꾸면 앱이 바로 맞춤. 취소된 날에는 올 사람 수와 참석 기록이 쌓이지 않음."},{"what":"활동일·시각·참석 날짜를 기기 시계가 아니라 한국 시간으로 맞춤. 날짜가 없는 옛 참석·시각은 오늘로 보지 않음."}]},{"id":"1.11","date":"2026-08-24","title":"친구 신청·목록 정리","purpose":"친구는 신청 후 수락하면 서로 친구가 되고, 신청 칸과 친구 목록이 겹치지 않으며 양쪽 화면에 바로 보이게 함.","changes":[{"what":"친구 행을 이름·체육관 뱃지와 도착·초대·삭제로 나눠 모바일에서 글자가 세로로 깨지거나 스위치가 겹치지 않게 함.","was":"친구 행에 아바타·이름·체육관·도착 스위치·초대·삭제가 한 가로줄에 들어가 글자가 세로로 깨지거나 겹침.","now":"위줄에 아바타·이름·일정·체육관, 아래줄에 도착·초대(예약 켜진 경우)·친구 삭제를 둠.","gone":null},{"what":"이미 친구면 보낸·받은 신청 목록에서 빼 줌. 둘 다 신청했을 때 한쪽만 수락해도 반대 신청은 사라지고 한 쌍만 남음. 같은 방향으로는 신청을 한 번만 보냄.","was":"이미 친구인데도 보낸 신청에 같이 보이거나, 서로 신청한 뒤 한쪽만 수락하면 반대 신청이 남을 수 있음.","now":"이미 친구면 신청 칸에서 빼고, 수락 시 반대 pending을 지우며 같은 방향 신청은 한 번만 보냄.","gone":null},{"what":"친구를 삭제하면 수락·남은 신청 줄도 같이 지움. 친구 탭을 열 때와 상대가 신청·수락할 때 목록이 바로 갱신됨. Supabase에 038_friend_request_unique.sql 적용 필요.","was":"친구 삭제 후 수락 줄이 로컬에 남거나, 신청·수락이 상대 친구 탭에 늦게 반영될 수 있음.","now":"삭제 시 그 쌍의 신청·수락 줄을 지우고, 실시간 hydrate와 친구 탭 포커스 때 목록을 다시 불러옴.","gone":null},{"what":"친구 도착 알림 스위치를 켜면 바로 색이 바뀌게 함. 설정·데모·모집방 비밀번호 스위치도 같이 맞춤.","was":"친구 도착 스위치를 눌러도 웹에서 켜짐/꺼짐이 안 보이거나, 값이 바뀌어도 행이 다시 그려지지 않음.","now":"스위치를 켜면 바로 초록으로 바뀌고, 설정·데모·모집방 비밀번호 스위치도 같은 방식으로 보임.","gone":null},{"what":"거절된 뒤에도 다시 친구 신청할 수 있게 함. 저장에 실패하면 보낸 신청 칸에서 바로 지움.","was":"거절된 신청 행이 남아 있으면 같은 사람에게 다시 신청할 때 DB 유니크로 저장이 실패하고, 화면에는 신청이 남은 것처럼 보임.","now":"거절 행을 pending으로 다시 쓰고, 원격 저장 실패 시 보낸 신청을 지우고 안내함.","gone":null}],"story":"친구는 한 방향 신청 후 수락하면 서로 친구가 되는 모델인데, 이미 친구인 사람이 보낸 신청에 남고 모바일 행이 한 줄에 몰려 깨지며 상대 화면 갱신이 늦을 수 있었음."},{"id":"1.12","date":"2026-08-25","title":"체육관 종료 리셋·온 사람","purpose":"활동이 끝나면 체육관 표시가 남기지 않고, 올 사람과 지금 온 사람을 같이 볼 수 있게 함.","changes":[{"what":"활동 시간이 끝나면 전원 체육관 표시를 끔. 활동 밖에서는 위치가 가까워도 체육관으로 다시 켜지지 않음. Supabase에 039_clear_at_gym_after_activity.sql 적용 필요.","was":"활동 시간이 지나도 체육관 표시가 남고, 위치가 가까우면 다시 켜질 수 있음.","now":"활동이 끝나면 전원 체육관 표시를 끄고, 활동 밖에서는 지오펜스로 다시 켜지 않음.","gone":null},{"what":"코트 현황의 「올 사람」「온 사람」을 누르면 하단 시트에 참석 의사와 지금 체육관에 있는 사람을 나눠 보여 줌.","was":"하단 시트에 오늘 올 사람만 보이고, 「지금」은 숫자만 표시됨.","now":"올 사람·온 사람 숫자 모두 시트를 열고, 시트 안에서 두 명단을 나눠 보여 줌.","gone":null}],"story":"출석·도착으로 is_at_gym이 켜진 뒤 활동이 끝나도 꺼지지 않아 「체육관」이 남았고, 하단 시트에는 올 사람만 보여 온 사람을 같이 볼 수 없었음."},{"id":"1.13","date":"2026-08-26","title":"활동 자동 알림·잔여 시간","purpose":"활동일 자동 푸시가 정각을 놓쳐도 따라잡고, 활동 끝날 때 잔여가 -1시간으로 깨지지 않게 함.","changes":[{"what":"활동 자동 알림은 정각 ±4분뿐 아니라, 놓치면 활동 시작까지 당일 1회 따라잡음. 발송에 실패하면 날짜를 찍지 않아 다음 크론에서 다시 시도함. Edge Function scheduled-activity-notify 재배포 필요.","was":"알림 시각 ±4분을 벗어나면 그날 자동 발송이 없고, broadcast 실패 후에도 last_auto_sent_date가 오늘로 남을 수 있음.","now":"정각을 놓쳐도 활동 시작까지 따라잡고, 성공한 뒤에만 당일 발송 완료로 기록함.","gone":null},{"what":"활동 종료 직전·직후 「잔여」가 -1시간 -1분으로 나오던 표시를 고침. 끝나면 잔여를 숨김.","was":"활동 종료 무렵 잔여가 -1시간 -1분처럼 보임.","now":"남은 시간이 없으면 잔여를 숨김.","gone":null}],"story":"자동 활동 알림은 5분 크론과 ±4분 창만 맞춰 정각을 한 번 놓치면 그날 안 갔고, 발송 실패에도 당일 발송 완료로 잠글 수 있었음. 잔여는 종료 분 이후 음수로 깨짐."},{"id":"1.14","date":"2026-08-28","title":"모집방·달력·로그·가입 제한","purpose":"파트너 모집에서 랭크를 끌 수 있게 하고, 관리자 달력·활동 로그·명단 가입 제한을 맞춤.","changes":[{"what":"파트너 모집 방 만들 때 「랭크 제한」 스위치로 켜기 전에는 최소·최대 랭크를 보이지 않음. Elo 기능이 꺼져 있으면 랭크 UI 전체 숨김."},{"what":"관리자 일정 달력에서 휴관·추가 활동일 배경색과 점 표시를 더 뚜렷하게 함. 오늘 날짜는 테두리 링으로 표시."},{"what":"활동 로그 전체 삭제 시 서버 DB에서도 지워 새로고침 후 다시 안 나옴. Supabase에 041_admin_logs_roster_signup.sql 적용 필요."},{"what":"명단 제한 ON일 때 명단에 없는 학번·이름으로 가입하면 승인 대기로 두고 관리자 활동 로그·알림에 남김. 관리 → 가입·참고에서 명단 붙여넣기·제한 스위치 사용."},{"what":"iPhone·PWA에서 하단 탭 글자가 잘리던 문제 수정. CSS safe-area와 탭 바 높이를 맞춤."},{"what":"iPhone·iPod 세로(웹앱·Safari·앱)에서는 하단 탭을 아이콘만 표시. 가로·Android·PC는 기존 규칙 유지."},{"what":"좁은 화면에서 알림 패널이 화면 밖으로 나가거나 잘리던 문제 수정. 모바일은 모달로 띄우고 높이·너비를 화면에 맞춤."},{"what":"브라우저 탭으로 열었을 때 로그인·설정에 웹앱 설치 안내 카드를 다시 표시. 홈 화면 Drop 아이콘(웹앱)이나 Play 앱에서는 숨김. 이용 안내에 언제 보이는지·기기별 추가 방법 항목 추가."},{"what":"iPhone Safari 탭에서는 알림 카드·첫 로그인 안내에 홈 화면 추가 단계를 펼쳐 보여 줌. PWA로 열면 알림 켜기 버튼만 표시."},{"what":"이용 안내 「웹앱 설치」에 언제 카드가 보이는지(브라우저 탭 O / 홈 화면·Play 앱 X)와 iPhone·Android·PC 단계별 그림 안내 추가."},{"what":"설치 안내를 지금 브라우저·기기만 표시(iPhone Safari / Android Chrome·기타 브라우저 / PC Chrome·Edge). 단계는 2~3열 그리드. 홈 화면 웹앱으로 열면 로그인·설정·이용 안내에서 숨김."},{"what":"설치 안내를 기기별 한 장 그림 + 순서 설명으로 표시. 「언제 보이나요」에 지금 환경·보이는/안 보이는 경우를 구분해 표시."},{"what":"이용 안내에서 웹앱 설치를 활동 알림 항목 바로 아래로 옮김. 단계는 그림 번호와 맞춰 2열 배치. Android·PC 안내 그림 파일명 정리."},{"what":"웹앱(홈 화면 아이콘)이 아닌 브라우저 탭이면 iPhone·Android는 로그인·설정·이용 안내에 설치 안내 표시. PC는 이용 안내만. 웹앱·Play 앱이면 전부 숨김."},{"what":"모바일에서 「데스크톱 사이트」로 UA만 PC처럼 보여도 터치 기기면 iPhone·Android로 분류해 모바일 레이아웃·설치 안내를 유지."},{"what":"웹앱 설치 순서 설명이 좁은 화면에서도 2열(2×2) 그리드를 유지하도록 배치 수정."},{"what":"활동 시간이 아니면 관리자·데모 포함 출석 불가(취소 안내). 휴관·일정 변경 시 해당 날 참석·올 사람 목록에서 참석 의사 자동 삭제."},{"what":"활동 로그 전체 삭제가 RPC 미적용 DB에서도 동작하도록 폴백 추가. 웹 푸시·PWA 설치가 같은 service worker URL을 쓰도록 통일."},{"what":"회원가입 탭에서 간편 회원가입(Google)을 학번·비밀번호 폼 아래로 이동."},{"what":"설정에서 Google 간편 로그인 연동 OAuth 복귀 시 설정 화면으로 돌아오고 연동 상태를 갱신함. Supabase Manual Linking 안내 추가."},{"what":"설정에서 「기기 알림」과 「간편 로그인 연동」 카드를 좌우로 나란히 배치. 안내 문구와 Google 아이콘도 한 줄로 유지."},{"what":"회원가입 탭 간편 회원가입(Google) 제거. 가입은 학번·비밀번호만. 설정 간편 로그인 연동 UI 축소."},{"what":"Google 간편 로그인 성공 시에도 학번 로그인과 같이 이 기기에 계정을 저장해, 로그아웃 후 「기존 계정으로 로그인」 확인이 뜨도록 함."},{"what":"설정에서 기기 알림·간편 로그인을 다시 위아래로 배치. 간편 로그인은 화면(다크모드) 아래 한 줄 전체 너비 카드로 표시."}]}]};

      { id: 'court', label: '코트', color: '#a3a3a3', test: (t) => /코트|현황|예약|회전|테마|출석|참석|올 사람/.test(t) },
      { id: 'auth', label: '권한', color: '#f87171', test: (t) => /권한|운영자|관리자|게스트|명단|학번|RLS|보안|anon/.test(t) },
      { id: 'social', label: '친구', color: '#93c5fd', test: (t) => /친구|모집|합류|도착|로비|파트너/.test(t) },
    ];
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function paras(s) {
      return String(s ?? '')
        .split(/\n\n+/)
        .map((p) => p.trim())
        .filter(Boolean)
        .map((p) => `<p>${esc(p)}</p>`)
        .join('');
    }
    function blob(r) {
      return [r.title, r.purpose, r.story, ...(r.changes || []).map((c) => [c.what, c.was, c.now, c.gone].join(' '))].join(' ');
    }
    const releases = DATA.releases || [];

    document.getElementById('lede').textContent =
      DATA.intro +
      ' 각 항목은 이전 상태를 이어서 변경을 적고, 삭제가 있으면 따로 표시함.';
    document.getElementById('meta').innerHTML =
      `<span>${esc(DATA.org)}</span><span>${esc(DATA.docNo)}</span><span>updated ${esc(DATA.updated)}</span><span>v${esc(releases[0]?.id)} → v${esc(releases[releases.length - 1]?.id)}</span>`;

    document.getElementById('side').innerHTML =
      `<h2>Releases</h2>` +
      releases.map((r) =>
        `<a href="#v${esc(r.id)}" data-id="${esc(r.id)}"><span class="id">v${esc(r.id)}</span>${esc(r.title)}</a>`
      ).join('');

    function drawTree() {
      const padL = 44, padT = 28, colW = 72, rowH = 26;
      const w = padL + TRACKS.length * colW + 8;
      const h = padT + releases.length * rowH + 8;
      const xOf = (ti) => padL + ti * colW + colW / 2;
      const yOf = (i) => padT + i * rowH + 6;
      let svg = `<svg class="tree" viewBox="0 0 ${w} ${h}" role="img" aria-label="버전별 주제 흐름. 위가 이른 버전.">`;
      TRACKS.forEach((track, ti) => {
        svg += `<text x="${xOf(ti)}" y="16" text-anchor="middle" fill="${track.color}" font-size="11" font-family="IBM Plex Mono,monospace">${esc(track.label)}</text>`;
        const pts = [];
        releases.forEach((r, i) => { if (track.test(blob(r))) pts.push(i); });
        for (let k = 1; k < pts.length; k++) {
          svg += `<path class="lane" d="M${xOf(ti)} ${yOf(pts[k-1])} L${xOf(ti)} ${yOf(pts[k])}" fill="none" stroke="${track.color}" stroke-width="1.5" style="animation-delay:${ti * 90}ms"/>`;
        }
        pts.forEach((i) => {
          const r = releases[i];
          svg += `<circle data-id="${esc(r.id)}" cx="${xOf(ti)}" cy="${yOf(i)}" r="4.5" fill="${track.color}"/>`;
        });
      });
      releases.forEach((r, i) => {
        svg += `<text x="4" y="${yOf(i) + 4}" fill="#7e7e7e" font-size="10" font-family="IBM Plex Mono,monospace">v${esc(r.id)}</text>`;
      });
      svg += '</svg>';
      document.getElementById('tree').innerHTML = svg;
      document.querySelectorAll('#tree circle').forEach((el) => {
        el.addEventListener('click', () => {
          document.getElementById('v' + el.getAttribute('data-id'))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
    }

    function kv(cls, label, text) {
      if (!text) return '';
      return `<div class="kv ${cls}"><span class="k">${label}</span><span class="v">${esc(text)}</span></div>`;
    }
    function flow(c) {
      const was = String(c.was || '').trim().replace(/[.。]+$/, '');
      const now = String(c.now || '').trim();
      if (was && now) return `<p class="flow">${esc(was)}해서 ${esc(now)}</p>`;
      if (was || now) return `<p class="flow">${esc(was || now)}</p>`;
      return '';
    }

    document.getElementById('releases').innerHTML = releases.map((r) => {
      const items = (r.changes || []).map((c, i) => {
        return `<article class="item">
          <h3><span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(c.what)}</h3>
          ${flow(c)}
          ${kv('gone', '삭제', c.gone)}
        </article>`;
      }).join('');
      const lead = r.story
        ? `<div class="story">${paras(r.story)}</div>`
        : `<p class="purpose">${esc(r.purpose)}</p>`;
      return `<section class="release" id="v${esc(r.id)}">
        <div class="ver">v${esc(r.id)} · ${esc(r.date)}</div>
        <h2>${esc(r.title)}</h2>
        ${lead}
        ${items}
      </section>`;
    }).join('');

    const links = [...document.querySelectorAll('nav.side a')];
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) e.target.classList.add('in');
        if (!e.isIntersecting) return;
        const id = e.target.id.replace(/^v/, '');
        links.forEach((a) => a.classList.toggle('on', a.getAttribute('data-id') === id));
      });
    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.12 });
    document.querySelectorAll('.release').forEach((el) => io.observe(el));

    drawTree();
  </script>
</body>
</html>
